# Confluent Cloud Java Consumer - Microsoft Entra ID OAuth/OIDC

bootstrap.servers=<YOUR_BOOTSTRAP_SERVER>:9092
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler

# Microsoft Entra token endpoint
sasl.oauthbearer.token.endpoint.url=https://login.microsoftonline.com/<YOUR_TENANT_ID>/oauth2/v2.0/token

# Confluent Cloud OAuth mapping
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="<YOUR_CLIENT_ID>" clientSecret="<YOUR_CLIENT_SECRET>" scope="api://<YOUR_APP_ID>/.default" extension_logicalCluster="<YOUR_CLUSTER_ID>" extension_identityPoolId="<YOUR_POOL_ID>";

# Consumer settings
group.id=without-dkp-oidc-test-group
auto.offset.reset=earliest
enable.auto.commit=true
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
