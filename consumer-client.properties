# Confluent Cloud Java Consumer - Microsoft Entra ID OAuth/OIDC (DKP CC)

bootstrap.servers=lkc-1o1jkv.eastus.azure.private.confluent.cloud:9092
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.oauthbearer.token.endpoint.url=https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler

# Resolve ${env:AZURE_CLIENT_SECRET} from the process environment
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

# Path B uses the built-in client-credentials callback below:
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
  clientId="<APP_ID>" \
  clientSecret="${env:AZURE_CLIENT_SECRET}" \
  scope="api://<APP_ID>/.default" \
  extension_logicalCluster="lkc-vgr7p5" \
  extension_identityPoolId="<POOL_ID>";

# Consumer settings
group.id=dkp-java-oidc-test-group
auto.offset.reset=earliest
enable.auto.commit=true
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
